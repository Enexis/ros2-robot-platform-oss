# Configuration Settings for the Rover Rx

# GNSS/INS Parameters

device: serial:/dev/serial/by-id/usb-Septentrio_Septentrio_USB_Device_0100027997-if00
# device: tcp://192.168.3.1:28784

serial:
  baudrate: 921600
  hw_flow_control: "off"

stream_device:
  tcp:
    ip_server: ""
    port: 0
  udp:
    ip_server: ""
    port: 0
    unicast_ip: ""

configure_rx: true

login:
  user: ""
  password: ""

custom_commands_file: ""

osnma:
  mode: "off"
  ntp_server: ""
  keep_open: true

poi_frame_id: base_link
insert_local_frame: true

frame_id: aux_gps_link

aux1_frame_id: gps_link

get_spatial_config_from_tf: true

use_ros_axis_orientation: true

receiver_type: gnss

multi_antenna: true

datum: Default

# not used since get_spatial_config_from_tf: true
att_offset:
  heading: 0.0
  pitch: 0.0

ant_type: "Unknown"
ant_serial_nr: "Unknown"
ant_aux1_type: "Unknown"
ant_aux1_serial_nr: "Unknown"

polling_period:
  pvt: 100
  rest: 500

# time
use_gnss_time: false
ntp_server: false
ptp_server_clock: false
latency_compensation: true

# RTK
rtk_settings:  
  # ntrip_1:
  #   id: ""
  #   caster: ""
  #   caster_port: 2101
  #   username: ""
  #   password: ""
  #   mountpoint: ""
  #   version: "v2"
  #   tls: false
  #   fingerprint: ""
  #   rtk_standard: "auto"
  #   send_gga: "auto"
  #   keep_open: true
  # ip_server_1:
  #   id: ""
  #   port: 0
  #   rtk_standard: "auto"
  #   send_gga: "auto"
  #   keep_open: true
  serial_1:
    port: "USB2"
    baud_rate: 115200
    rtk_standard: "auto"
    send_gga: "auto"
    keep_open: true

publish:
  # For both GNSS and INS Rxs
  auto_publish: false
  publish_only_valid: false
  pvtgeodetic: true # required for navsatfix
  poscovgeodetic: true # required for navsatfix
  navsatfix: true
  atteuler: true # required for pose
  attcoveuler: true # required for pose
  pose: true # lat lon alt roll pitch yaw
  gpgga: true # publish gpgga for RTK caster
  tf: false

  gpsfix: false
  gprmc: false
  gpst: false
  measepoch: false
  pvtcartesian: false
  basevectorcart: false
  basevectorgeod: false
  poscovcartesian: false
  velcovcartesian: false
  velcovgeodetic: false
  twist: false
  diagnostics: false
  aimplusstatus: false
  galauthstatus: false
  # For GNSS Rx only
  gpgsa: false
  gpgsv: false

# logger
activate_debug_log: false
