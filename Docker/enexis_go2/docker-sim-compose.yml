services: 
  platform_kit:
    image: enexis/go2:latest
    build:
      context: ../../
      dockerfile: Docker/enexis_go2/Dockerfile
      target: go2
    extends:
      service: common
      file: ../docker-compose.common.yml
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/jazzy/setup.sh && ros2 node list | grep -q /robot_state_publisher"]
      interval: 2s
      retries: 3
    command:
      - /bin/bash 
      - -c
      - ros2 launch enexis_go2 go2.launch.py use_sim_time:=True
  
  localization:
    image: enexis/go2:latest
    extends:
      service: common
      file: ../docker-compose.common.yml
    command:
      - /bin/bash 
      - -c
      - ros2 launch localization localization.launch.py use_sim_time:=True start_ekf_local:=True start_ekf_global:=False start_navsat_transform:=False
  slam:
    profiles: ["mapping"]
    image: enexis/go2:latest
    extends:
      service: common
      file: ../docker-compose.common.yml
    depends_on:
      gazebo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/jazzy/setup.sh && ros2 lifecycle get /slam_toolbox | grep -Fx 'active [3]' > /dev/null"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 3
    command:
      - /bin/bash
      - -c
      - ros2 launch slam_toolbox online_async_launch.py use_sim_time:=true slam_params_file:=/workspace/install/nav2/share/nav2/config/slam_sim.yaml

  nav:
    image: enexis/go2:latest
    extends:
      service: common
      file: ../docker-compose.common.yml
    command:
      - /bin/bash 
      - -c
      - ros2 launch nav2 nav2.launch.py use_sim_time:=True

  rviz:
    image: enexis/dev:latest
    extends:
      service: common
      file: ../docker-compose.common.yml
    depends_on:
      gazebo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/jazzy/setup.sh && ros2 node list | grep -Fx /rviz > /dev/null"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 3
    command:
      - /bin/bash
      - -c
      - ros2 run rviz2 rviz2 -d /workspace/src/platform_kits/enexis_go2/config/rviz.rviz --ros-args -p use_sim_time:=true

  gazebo:
    image: enexis/dev:latest
    extends:
      service: common
      file: ../docker-compose.common.yml
    restart: always
    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/jazzy/setup.sh && ros2 node list | grep -Fx /gzserver > /dev/null"]
      interval: 2s
      timeout: 10s
      start_period: 120s
      retries: 3
    command: ros2 launch gazebo gazebo.launch.py world:=generated_world
