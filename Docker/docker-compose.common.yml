services:
  common:
    volumes: 
      - ../cyclonedds:/workspace/cyclonedds
      # Share X11 socket to allow GUI applications from the container
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Share the host X11 auth file (XWayland may use a session-specific path)
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro
    env_file:
      - .env
    privileged: true
    network_mode: host
    tty: true
    healthcheck:
      test:
        - CMD-SHELL
        - '[ -f /tmp/startup_complete ]'
      interval: 1s
      retries: 1000